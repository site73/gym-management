# 真实 MySQL 运行配置（E 盘便携 MySQL 8.0）
# 启动：java -jar target/gym-backend-1.0.0.jar --spring.profiles.active=mysql
# 结构由 Flyway 迁移脚本 V1–V8 管理，JPA 只做校验（ddl-auto: validate），不允许自动改表。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:${DB_PORT:3307}/${DB_NAME:gym}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:gym_app}
    password: ${DB_PASSWORD:gym_app_pwd}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate        # 表结构以迁移脚本为准
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    # 迁移脚本与种子数据由构建复制进 jar（原始文件仍在 07 目录，单一来源）
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: true
    validate-on-migrate: true
    encoding: UTF-8

  sql:
    init:
      mode: never              # 种子数据由 Flyway R__ 脚本负责

  h2:
    console:
      enabled: false

management:
  health:
    redis:
      enabled: false

wechat:
  appid: mock-appid
  secret: mock-secret
  pay:
    mchid: mock-mchid
    key: mock-key
    notify-url: http://127.0.0.1:8080/api/pay/notify

logging:
  level:
    root: INFO
    com.gym: DEBUG
    org.flywaydb: INFO
